<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escada do Saber (família)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8F6F2; --card:#FFFFFF; --ink:#1E2A4F; --muted:#5B6785; --line:#CBE2DC;
  --sun:#FFC43D; --coral:#FF6B6B; --teal:#12A58C; --violet:#6C5CE7; --orange:#FF9142;
  --ok:#12A58C; --bad:#E5484D; --soft:#F3FAF8;
  --cell:#FFFFFF; --zf:#D3F2EA; --zm:#FFEDBD; --zd:#FFD9D9; --start:#1E2A4F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111831; --card:#1B2446; --ink:#EEF2FF; --muted:#A5AFCF; --line:#2D3963;
    --soft:#212B52; --cell:#212B52; --zf:#17463E; --zm:#4A3F1C; --zd:#4D2530; --start:#EEF2FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111831; --card:#1B2446; --ink:#EEF2FF; --muted:#A5AFCF; --line:#2D3963;
  --soft:#212B52; --cell:#212B52; --zf:#17463E; --zm:#4A3F1C; --zd:#4D2530; --start:#EEF2FF;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:"Baloo 2","Nunito",system-ui,sans-serif;line-height:1.1;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
button:disabled{cursor:default}
#app{max-width:1000px;margin:0 auto;padding:16px}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:12px 18px;border-radius:16px;font-weight:800;font-size:18px;background:var(--ink);color:var(--bg);box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn:disabled{opacity:.45;box-shadow:none}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.sun{background:var(--sun);color:#1E2A4F;box-shadow:0 4px 0 #D29B16}
.btn.teal{background:var(--teal);color:#fff;box-shadow:0 4px 0 #0B7563}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.link{color:var(--muted);text-decoration:underline;font-weight:600;padding:8px}
.muted{color:var(--muted)}
.card{background:var(--card);border-radius:22px;padding:20px;border:2px solid var(--line)}

/* Home */
.home{max-width:440px;margin:4vh auto 0;display:grid;gap:22px}
.stair{display:flex;align-items:flex-end;gap:6px;height:88px}
.stair span{flex:1;border-radius:10px 10px 4px 4px}
.title{font-size:clamp(44px,13vw,64px);font-weight:800;letter-spacing:-.5px}
.subtitle{font-size:18px;color:var(--muted);margin-top:4px}
.note{font-size:14px;color:var(--muted);text-align:center}

/* Forms */
label.lbl{font-weight:800;display:block;margin-bottom:6px}
input.txt{width:100%;min-height:54px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;font:inherit;font-size:20px;font-weight:700}
input.code{text-transform:uppercase;letter-spacing:10px;text-align:center;font-family:"Baloo 2",sans-serif;font-size:32px}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.icons button{aspect-ratio:1;font-size:28px;border-radius:14px;background:var(--soft);border:3px solid transparent;display:grid;place-items:center}
.icons button[aria-pressed="true"]{border-color:var(--violet);background:var(--card);transform:scale(1.06)}
.icons button:disabled{opacity:.25}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--muted);padding:6px 0;margin-bottom:8px}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border-radius:10px;font-weight:800}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 2px 0 var(--line)}

/* Lobby */
.bigcode{font-family:"Baloo 2",sans-serif;font-size:64px;font-weight:800;letter-spacing:10px;text-align:center;line-height:1}
.plist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.plist li{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:14px;padding:10px 14px;font-weight:800}
.plist .ic{font-size:28px}
.tag{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700}

/* Game layout */
.game{display:grid;gap:16px}
@media (min-width:820px){.game{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.topbar h1{font-size:24px}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px;white-space:nowrap}

/* Board */
.boardwrap{width:100%;max-width:470px;margin:0 auto}
.board{position:relative;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:3px;aspect-ratio:1;background:var(--line);border-radius:18px;padding:3px}
.cell{background:var(--cell);border-radius:7px;display:grid;place-items:center;font-size:clamp(11px,3.4vw,16px);font-weight:800;color:var(--muted);position:relative}
.cell.z-f{background:var(--zf)}
.cell.z-m{background:var(--zm)}
.cell.z-d{background:var(--zd)}
.cell.start{background:var(--start)}
.cell .num{font-size:clamp(9px,2.6vw,12px);opacity:.55}
.cell .sym{font-size:clamp(14px,4.4vw,20px);line-height:1}
.center{grid-column:2/7;grid-row:2/7;background:var(--card);border-radius:12px;display:grid;place-items:center;text-align:center;padding:8px}
.center .who{font-size:clamp(40px,12vw,60px);line-height:1}
.center .nm{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(18px,5vw,24px)}
.center .st{font-size:14px;color:var(--muted);max-width:26ch}
.tokens{position:absolute;inset:0;pointer-events:none}
.tok{position:absolute;top:0;left:0;display:grid;place-items:center;transition:transform .26s cubic-bezier(.3,.7,.4,1);will-change:transform}
.tok span{display:block;line-height:1;filter:drop-shadow(0 2px 1px rgba(0,0,0,.3))}
.tok.me span{filter:drop-shadow(0 0 0 transparent) drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.tok.hop span{animation:hop .26s ease-out}
@keyframes hop{0%{transform:translateY(0)}45%{transform:translateY(-45%) scale(1.15)}100%{transform:translateY(0)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:13px;color:var(--muted);margin-top:8px;font-weight:600}
.legend b{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px}

/* Panel */
.panel{display:grid;gap:14px}
.subjects{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.subj{border-radius:18px;padding:16px 12px;min-height:104px;display:grid;gap:4px;justify-items:center;align-content:center;color:#fff;font-weight:800;font-family:"Baloo 2",sans-serif;font-size:19px;line-height:1.1;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.subj .e{font-size:30px}
.subj:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.subj:disabled{opacity:.55}
.qhead{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.dot{width:12px;height:12px;border-radius:50%}
.question{font-family:"Baloo 2",sans-serif;font-size:clamp(21px,5.6vw,26px);font-weight:700;line-height:1.2}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;min-height:56px;padding:10px 14px;border-radius:16px;background:var(--soft);border:2px solid var(--line);font-weight:700;font-size:17px;line-height:1.25}
.opt .k{flex:none;width:32px;height:32px;border-radius:10px;background:var(--card);display:grid;place-items:center;font-family:"Baloo 2",sans-serif;font-weight:800;border:2px solid var(--line)}
.opt.right{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.right .k,.opt.wrong .k{background:rgba(255,255,255,.25);border-color:transparent;color:#fff}
.opt:disabled:not(.right):not(.wrong){opacity:.8}

/* Ladder: a literal staircase */
.ladder{display:flex;align-items:flex-end;gap:4px;height:64px}
.step{flex:1;border-radius:6px 6px 3px 3px;background:var(--soft);border:2px solid var(--line);position:relative}
.step.done{border-color:transparent}
.step.now{outline:3px solid var(--ink);outline-offset:1px}
.ladlab{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--muted);margin-top:4px}
.banner{border-radius:18px;padding:16px;font-weight:800;text-align:center}
.banner.ok{background:var(--ok);color:#fff}
.banner.bad{background:var(--bad);color:#fff}
.banner.info{background:var(--soft)}
.banner .big{font-family:"Baloo 2",sans-serif;font-size:30px;line-height:1.1}
.fx{font-size:15px;font-weight:700;margin-top:4px}

.dicebox{display:flex;align-items:center;gap:16px;border-radius:18px;padding:14px 16px;font-weight:800}
.dicebox.ok{background:var(--ok);color:#fff}
.dicebox.back{background:var(--bad);color:#fff}
.dicebox.gift{background:var(--violet);color:#fff}
.die{flex:none;width:68px;height:68px;border-radius:16px;background:#fff;color:#1E2A4F;display:grid;place-items:center;font-family:"Baloo 2",sans-serif;font-size:42px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.die.rolling{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
.dicebox .big{font-family:"Baloo 2",sans-serif;font-size:26px;line-height:1.1}
.dicebox .msg{font-size:15px;margin-top:2px}
.dicebox .msg.wait{opacity:0}
.lvl{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:800;font-size:14px;color:#1E2A4F}
/* Scores */
.scores{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.scores li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-weight:800}
.scores li.cur{border-color:var(--ink)}
.scores .ic{font-size:24px}
.scores .pts{margin-left:auto;font-family:"Baloo 2",sans-serif;font-size:20px}
.scores .r{font-size:12px;color:var(--muted);font-weight:700}

/* Podium */
.podium{display:grid;gap:10px}
.podium li{font-size:18px}
.winner{text-align:center}
.winner .ic{font-size:84px;line-height:1;display:inline-block;animation:pop .7s cubic-bezier(.2,1.6,.4,1) both, bob 1.6s .7s ease-in-out infinite}
.winner .yay{font-family:"Baloo 2",sans-serif;font-size:18px;font-weight:800;color:var(--violet)}
@keyframes pop{0%{transform:scale(0) rotate(-20deg)}100%{transform:scale(1) rotate(0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.badge{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--sun);color:#1E2A4F;font-size:12px;font-weight:800;vertical-align:1px}
.menu{display:grid;gap:10px}
.board-list{list-style:none;margin:12px 0 16px;padding:0;display:grid;gap:6px}
.board-list li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--soft);font-weight:800}
.board-list .pos{width:30px;text-align:center;font-family:"Baloo 2",sans-serif;font-size:20px}
.board-list .ic{font-size:24px}
.board-list .pts{margin-left:auto;font-family:"Baloo 2",sans-serif;font-size:20px}
.board-list .dt{display:block;font-size:12px;color:var(--muted);font-weight:600}
.cpuadd{display:flex;align-items:center;gap:10px}

/* Modal + toast */
.modal{position:fixed;inset:0;background:rgba(10,14,30,.55);display:grid;place-items:center;padding:16px;z-index:10}
.modal .card{max-width:440px;width:100%;max-height:85vh;overflow:auto}
.rules{padding-left:20px;margin:10px 0 16px;display:grid;gap:8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:800;max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.winner .ic{animation:none}.die.rolling{animation:none}.tok{transition:none}.tok.hop span{animation:none}.btn{transition:none}}

/* v3 */
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn.sm{min-height:48px;font-size:15px;padding:8px 6px}
.plist .r,.scores .r{font-size:12px;color:var(--muted);font-weight:700}
.x{margin-left:6px;width:32px;height:32px;border-radius:10px;color:var(--muted);font-weight:800}
.qtopic{font-size:13px;color:var(--muted);font-weight:700;margin-top:-6px}
.qrow{display:flex;gap:10px;align-items:flex-start}
.qrow .question{flex:1}
.say{flex:none;width:44px;height:44px;border-radius:12px;background:var(--soft);border:2px solid var(--line);font-size:20px}
.timer{margin-left:8px;padding:2px 10px;border-radius:999px;background:var(--soft);font-weight:800;font-size:14px}
.timer.low{background:var(--bad);color:#fff}
.typed{display:flex;align-items:center;gap:10px}
.typed .txt{flex:1;font-size:26px;text-align:center}
.unit{font-family:"Baloo 2",sans-serif;font-size:24px;font-weight:800}
.subj.picked{outline:4px solid var(--ink);outline-offset:3px;transform:scale(1.04)}
.badge.bad{background:var(--bad);color:#fff}
.explain{border-radius:18px;padding:14px 16px;background:var(--card);border:2px solid var(--line);font-size:16px;line-height:1.45}
.explain.ok{border-color:var(--ok)}
.explain.bad{border-color:var(--bad)}
.rblock{margin-top:14px}
.rhead{display:flex;align-items:center;gap:8px;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:18px;margin-bottom:6px}
.rp{margin-left:auto}
.trow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 78px;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 6px;border-radius:10px;font-size:14px;font-weight:700}
.trow:hover{background:var(--soft)}
.tn{min-width:0}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.bar span{display:block;height:100%;border-radius:99px}
.tp{text-align:right;color:var(--muted);font-size:12px;white-space:nowrap}
.dicebox .die{font-size:30px}

/* v4 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lvl.xb{background:var(--ink);color:var(--bg)}
.xhead{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:10px 6px 2px}
.opt.sel{border-color:var(--violet);background:var(--card);box-shadow:inset 0 0 0 1px var(--violet)}
.opt.sel .k{background:var(--violet);color:#fff;border-color:transparent}
.opt.missed{border-style:dashed;border-color:var(--ok)}
.mis{color:var(--muted);font-weight:700;font-style:normal;font-size:14px}
.pickn{margin:-4px 0 0;font-weight:800;color:var(--violet)}
.dicebox.part{background:var(--sun);color:#1E2A4F}
.btn.left{justify-content:flex-start;text-align:left;font-size:16px;flex-wrap:wrap}
.qr{background:#fff;border-radius:16px;padding:10px;width:min(240px,70vw);margin:12px auto 0}.qr svg{display:block;width:100%;height:auto}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>

/* Respostas escritas: normaliza números (espaços, vírgula decimal, unidades, «x =») */
function numOf(s){
  let c=String(s).toLowerCase().replace(/x\s*=/,"").replace(/cm³|m³|cm3|m3|cm|°|graus/g,"").replace(/\s/g,"");
  if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(c)) c=c.replace(/\./g,"");
  c=c.replace(".",",");
  return /^\d+(,\d+)?$/.test(c) ? parseFloat(c.replace(",",".")) : null;
}
function unitOf(ans){ const m=String(ans).match(/cm³|m³|°|cm/); return m?m[0]:""; }
/* Normaliza o banco: mc = escolha simples, multi = escolher várias, num = resposta escrita */
function normQ(subj, e){
  let o;
  if(e.length===5) o={d:e[0], ti:e[1], q:e[2], type:"num", n:e[3].n, a:[e[3].n], w:[], e:e[4]};
  else if(e.length===6) o={d:e[0], ti:e[1], q:e[2], type:"multi", a:e[3], w:e[4], e:e[5]};
  else {
    o={d:e[0], ti:e[1], q:e[2], type:"mc", a:[e[3]], w:[e[4],e[5],e[6]], e:e[7]};
    // Contas de Matemática (todos os níveis): resposta escrita em vez de opções
    if(subj==="mat" && o.ti>0 && o.ti<XT.mat && numOf(o.a[0])!==null){ o.type="num"; o.n=o.a[0]; }
  }
  o.x = o.ti >= XT[subj];
  return o;
}

const optText = (q, o) => o < q.a.length ? q.a[o] : q.w[o-q.a.length];
function evaluate(q, opts, val){
  if(val==="⏱") return "bad";
  if(q.type==="num"){ const v=numOf(val), a=numOf(q.n); return v!==null && Math.abs(v-a)<1e-9 ? "ok" : "bad"; }
  if(q.type==="multi"){
    const k=q.a.length, sel=(val||[]).map(i=>opts[i]), good=sel.filter(o=>o<k).length;
    return good===k && sel.length===k ? "ok" : good>0 ? "part" : "bad";
  }
  return opts[val] < 1 ? "ok" : "bad";
}

function beep(notes){
  if(!soundOn) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    let t=AC.currentTime+.01;
    notes.forEach(([f,d])=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type="triangle"; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.03); t+=d*.85; });
  }catch{}
}

const kindOf = pid => (S && S.players[pid] && S.players[pid].kind) || "kid";
const isCpu = pid => kindOf(pid)==="cpu";
const isDriver = () => mode==="local" || (mode==="online" && S && S.host===me.pid);
const canAct = () => !!S && S.status==="playing" && !isCpu(curPid()) && (mode==="local" || curPid()===me.pid);
const humanHere = () => mode==="local" || (S && S.players[me.pid] && !isCpu(me.pid));

/* ============ Persistência ============ */
function commit(n){
  n.seq = (S?.seq||0) + 1;
  S = n;
  if(mode==="local") save("esc_local", S);
  else if(mode==="online" && db){
    db.doc("rooms/"+roomCode).set(S).catch(e=>{
      toast(e && e.code==="invalid_argument" ? "Este link não te deixa jogar online. Pede ao anfitrião acesso de Contribuidor." : "Falhou a ligação. Tenta de novo.");
    });
  }
  render();
}
function act(fn){ if(!S) return; const n = structuredClone(S); fn(n); commit(n); }

/* ============ Registos: recordes e progresso ============ */
const recKey = nm => "n-" + (String(nm).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "sem-nome");
function makeStore(col, lsKey){
  return {
    async all(){ if(db){ try{ return (await db.collection(col).get()).docs.map(d=>d.data()); }catch{} } return Object.values(load(lsKey)||{}); },
    async get(key){ if(db){ try{ const d=await db.doc(col+"/"+key).get(); return d.exists?d.data():null; }catch{} } return (load(lsKey)||{})[key]||null; },
    async put(key,val){ if(db){ try{ await db.doc(col+"/"+key).set(val); return; }catch{} } const m=load(lsKey)||{}; m[key]=val; save(lsKey,m); },
    async del(key){ if(db){ try{ await db.doc(col+"/"+key).delete(); }catch{} } const m=load(lsKey)||{}; delete m[key]; save(lsKey,m); }
  };
}
const Rec = makeStore("records","esc_records");
const Stats = makeStore("stats","esc_stats");
const statsCache = {};
async function loadStats(names){ for(const nm of names){ const k=recKey(nm); if(!statsCache[k]){ statsCache[k] = (await Stats.get(k)) || {name:nm, key:k, t:{}, w:[], r:[]}; } } }
let statsChain = Promise.resolve();
function addStat(name, qid, ok){
  statsChain = statsChain.then(async ()=>{
    const k=recKey(name);
    const s = statsCache[k] || (await Stats.get(k)) || {name, key:k, t:{}, w:[], r:[]};
    s.name=name; s.key=k;
    const [subj]=qid.split(":"), tk=subj+":"+qOf(qid)[1], c=s.t[tk]||[0,0];
    c[0]++; if(ok) c[1]++; s.t[tk]=c;
    s.w=s.w.filter(x=>x!==qid); s.r=s.r.filter(x=>x!==qid); (ok?s.r:s.w).push(qid);
    statsCache[k]=s; await Stats.put(k,s);
  }).catch(()=>{});
}

function addEssay(name, theme, score){
  statsChain = statsChain.then(async ()=>{
    const k=recKey(name);
    const s = statsCache[k] || (await Stats.get(k)) || {name, key:k, t:{}, w:[], r:[]};
    s.name=name; s.key=k; s.es=(s.es||[]).concat({d:Date.now(), t:theme, v:score}).slice(-30);
    statsCache[k]=s; await Stats.put(k,s);
  }).catch(()=>{});
}

/* ============ Lógica do jogo ============ */
function pickQuestion(n){
  const t=n.turn, pid=n.order[n.turnIdx], kind=n.players[pid].kind;
  const zone=zoneOf(n.pos[pid]), d = kind==="adult" ? UP[zone] : zone, key=t.subj+d;
  const pool = QN[t.subj].map((q,i)=>q.d===d?i:-1).filter(i=>i>=0);
  const base = pool.filter(i=>!QN[t.subj][i].x), ext = n.extra===false ? [] : pool.filter(i=>QN[t.subj][i].x);
  let used = n.used[key] || [];
  const curIdx = t.q ? +t.q.split(":")[1] : -1;
  const free = src => src.filter(i=>!used.includes(i) && i!==curIdx);
  const useExt = ext.length && (!base.length || Math.random()<.3);
  let avail = free(useExt?ext:base);
  if(!avail.length) avail = free(useExt?base:ext);
  if(!avail.length){ used=[]; avail=(useExt?ext:base).filter(i=>i!==curIdx); if(!avail.length) avail=pool.filter(i=>i!==curIdx); }
  // Prioridade: perguntas que este jogador já errou; depois as que ainda não acertou
  const st = kind!=="cpu" ? statsCache[recKey(n.players[pid].name)] : null;
  let idx;
  if(st){
    const wrong = avail.filter(i=>st.w.includes(t.subj+":"+i));
    const fresh = avail.filter(i=>!st.r.includes(t.subj+":"+i));
    idx = wrong.length && Math.random()<.4 ? pick(wrong) : fresh.length ? pick(fresh) : pick(avail);
  } else idx = pick(avail);
  used.push(idx); n.used[key]=used;
  const q=QN[t.subj][idx];
  t.q=t.subj+":"+idx; t.qn=(t.qn||0)+1; t.pick=null; t.res=null; t.diff=d;
  t.opts = q.type==="num" ? null : shuffle(q.a.concat(q.w).map((_,i)=>i));
  t.limit = kind==="adult" ? (q.type==="num" ? 45 : q.type==="multi" ? 30 : ADULT_TIME) : 0;
}
function moveBy(n, pid, delta){
  const from=n.pos[pid], to=Math.max(0, Math.min(N, from+delta)), path=[from];
  for(let p=from; p!==to; ){ p += to>from ? 1 : -1; path.push(p); }
  n.pos[pid]=to;
  n.anim={id:rid(), pid, path};
  if(to===N) n.finishing=true;
  return Math.abs(to-from);
}
function resolve(n, val){
  const t=n.turn; if(t.phase!=="question") return;
  const pid=n.order[n.turnIdx], z=zoneOf(n.pos[pid]), c3=n.players[pid].kind==="cpu";
  const res = evaluate(qOf(t.q), t.opts, val);
  t.pick=val; t.res=res; t.ok=res==="ok"; t.rid=rid();
  n.acc[pid][0]++;
  if(res==="ok"){
    n.acc[pid][1]++;
    n.streak[pid]++;
    const hot = n.streak[pid]>=3, die = pick(BONUS_DIE);
    const pts = Math.round(PTS[z]*(hot?1.5:1));
    n.score[pid]+=pts; t.pts=pts;
    const moved = moveBy(n, pid, ADV[z] + (hot?1:0) + die);
    t.roll={id:rid(), v:die};
    const parts=[`+${ADV[z]} pelo nível ${DIFF_NAME[z].toLowerCase()}`];
    if(hot) parts.push(`+1 pela sequência de ${n.streak[pid]} acertos 🔥`);
    parts.push(die ? `+${die} do dado bónus` : "o dado bónus deu 0");
    t.fx = `${n.pos[pid]===N?(c3?"Chegou à meta! ":"Chegaste à meta! "):""}${c3?"Avança":"Avanças"} ${moved} ${moved===1?"casa":"casas"} (${parts.join(", ")}) e ${c3?"ganha":"ganhas"} ${pts} pontos.`;
  } else if(res==="part"){
    n.streak[pid]=0; t.pts=0; t.roll=null;
    t.fx = c3 ? "Acertou em parte: fica no mesmo lugar." : "Acertaste em parte: ficas no mesmo lugar, sem perder pontos.";
  } else {
    n.streak[pid]=0;
    const lost=Math.min(WRONG_PTS, n.score[pid]); n.score[pid]-=lost; t.pts=-lost;
    const moved = moveBy(n, pid, -WRONG_BACK);
    t.roll=null;
    t.fx = (val==="⏱" ? "O tempo acabou. " : "") + (moved ? `${c3?"Recua":"Recuas"} ${WRONG_BACK} casa` : (c3?"Fica na partida":"Ficas na partida")) + (lost ? ` e ${c3?"perde":"perdes"} ${lost} pontos.` : ".");
  }
  t.phase="result";
}
function afterAnswer(){
  const t=S.turn, pid=curPid();
  if(!isCpu(pid) && t.q) addStat(S.players[pid].name, t.q, t.ok);
}
function doChoose(subj){ act(n=>{ n.turn.subj=subj; pickQuestion(n); n.turn.phase="question"; }); }
function doAnswer(val){
  if(qOf(S.turn.q).type==="num" && val!=="⏱" && numOf(val)===null){ toast("Escreve só o número. Usa vírgula para as casas decimais."); return; }
  act(n=>resolve(n, val)); afterAnswer();
}
function doTimeout(){ doAnswer("⏱"); }
function doSkip(){ act(n=>{ const pid=n.order[n.turnIdx]; if(n.skips[pid]>0 && n.turn.phase==="question"){ n.skips[pid]--; pickQuestion(n); } }); }
function doEndTurn(forced){
  act(n=>{
    const pid=n.order[n.turnIdx], t=n.turn, nm=n.players[pid]?.name||"";
    n.last = forced ? `${nm} passou a vez.` : t.phase==="result" ? `${nm} ${t.ok?"acertou":"errou"} e está na casa ${n.pos[pid]>=N?"🏁":n.pos[pid]}.` : "";
    let i=n.turnIdx, wrapped=false;
    for(let k=0;k<n.order.length;k++){ i=(i+1)%n.order.length; if(i===0) wrapped=true; if(n.pos[n.order[i]]<N) break; }
    const anyLeft=n.order.some(p=>n.pos[p]<N);
    if(!anyLeft || (n.finishing && wrapped)) n.status="ended";
    else { if(wrapped) n.round++; n.turnIdx=i; n.turn=freshTurn(); }
  });
}
function doRematch(){
  finalizing=null;
  act(n=>{ const g=newGame(n.players, n.order, {code:n.code, host:n.host, extra:n.extra}); Object.keys(n).forEach(k=>delete n[k]); Object.assign(n, g); });
}
function ranking(){ return [...S.order].sort((a,b)=> (S.pos[b]-S.pos[a]) || (S.score[b]-S.score[a]) || (pct(S.acc[b][1],S.acc[b][0])-pct(S.acc[a][1],S.acc[a][0]))); }

let finalizing=null;
async function finalizeRecords(){
  if(!S || S.status!=="ended" || S.recs || !isDriver() || finalizing===S.id) return;
  finalizing=S.id; const gid=S.id, out={};
  const humans=S.order.filter(p=>!isCpu(p)).sort((a,b)=>S.score[b]-S.score[a]);
  for(const p of humans){
    const nm=S.players[p].name, key=recKey(nm), sc=S.score[p], a=S.acc[p];
    const prev=await Rec.get(key);
    const isNew = !!prev && sc>prev.best;
    if(!prev || isNew) await Rec.put(key, {name:nm, icon:S.players[p].icon, best:sc, acc:pct(a[1],a[0]), date:Date.now()});
    out[p]={prev: prev?prev.best:null, isNew, first:!prev};
  }
  if(S && S.id===gid && S.status==="ended") act(n=>{ n.recs=out; });
}

/* ============ CPU ============ */
let cpuKey=null, cpuTimer=null;
function cpuAnswer(){
  const t=S.turn, q=qOf(t.q), ok=Math.random()<CPU_OK[q.d];
  if(q.type==="num"){
    if(ok) return q.n;
    const v=numOf(q.n); let w=v;
    while(w===v) w = Math.max(0, Math.round((v + pick([-3,-2,-1,1,2,4,10])) * 100)/100);
    return String(w).replace(".",",");
  }
  const pos = t.opts.map((o,i)=>i);
  if(q.type==="multi"){
    const k=q.a.length, right=pos.filter(i=>t.opts[i]<k);
    if(ok) return right;
    let sel; do { sel=shuffle(pos).slice(0,k); } while(sel.every(i=>t.opts[i]<k));
    return sel;
  }
  const right=t.opts.indexOf(0);
  return ok ? right : pick(pos.filter(i=>i!==right));
}
function driveCpu(){
  if(!S || S.status!=="playing" || !isCpu(curPid())) return;
  const stale = mode==="online" && performance.now()-lastChange>12000;
  if(!isDriver() && !stale) return;
  const key=S.id+":"+S.seq; if(cpuKey===key) return;
  cpuKey=key; clearTimeout(cpuTimer);
  const still = () => S && S.status==="playing" && S.id+":"+S.seq===key;
  const t=S.turn;
  if(t.phase==="choose"){
    cpuTimer=setTimeout(()=>{
      if(!still()) return;
      const subj=pick(Object.keys(SUBJ)), b=document.querySelector(`.subj[data-v="${subj}"]`);
      if(b) b.classList.add("picked");
      cpuTimer=setTimeout(()=>{ if(still()) doChoose(subj); }, 900);
    }, 1500);
  } else if(t.phase==="question"){
    cpuTimer=setTimeout(()=>{ if(still()) doAnswer(cpuAnswer()); }, 3200);
  }
  // Na fase de resultado o CPU espera: é um humano que toca em «Continuar».
}

function genCode(){ const L="ABCDEFGHJKLMNPQRSTUVWXYZ"; let s=""; for(let i=0;i<4;i++) s+=L[Math.floor(Math.random()*L.length)]; return s; }
function subscribe(code){
  unsub();
  roomCode=code; mode="online"; save("esc_room", code);
  unsubRoom = db.doc("rooms/"+code).onSnapshot(snap=>{
    if(!snap.exists) return;
    const d = snap.data();
    if(!S || (d.seq||0) >= (S.seq||0) || d.status!==S.status || d.id!==S.id){ S = structuredClone(d); }
    if(S.status==="lobby") view="lobby";
    else { view="game"; if(S.players) loadStats(Object.values(S.players).filter(p=>p.kind!=="cpu").map(p=>p.name)); }
    render();
  }, e=>{ if(e.code==="revoked"){ toast("Perdeste o acesso a esta sala."); leave(); } });
  unsubPlayers = db.collection("rooms/"+code+"/players").onSnapshot(qs=>{
    lobbyPlayers = qs.docs.map(d=>({pid:d.id, ...d.data()})).sort((a,b)=>(a.t||0)-(b.t||0));
    if(view==="lobby") render();
  });
}
function unsub(){ if(unsubRoom) unsubRoom(); if(unsubPlayers) unsubPlayers(); unsubRoom=unsubPlayers=null; }
async function createRoom(){
  if(!db) return;
  let code = genCode();
  try{
    for(let k=0;k<5;k++){ const s=await db.doc("rooms/"+code).get(); if(!s.exists) break; code=genCode(); }
    await db.doc("rooms/"+code).set({v:4, code, host:me.pid, status:"lobby", extra:true, seq:1});
    await db.doc(`rooms/${code}/players/${me.pid}`).set({name:me.name, icon:me.icon, kind:me.kind, t:Date.now()});
    S=null; subscribe(code); view="lobby"; render();
  }catch(e){ toast(e && e.code==="invalid_argument" ? "Este link não te deixa criar salas. Pede acesso de Contribuidor." : "Não foi possível criar a sala. Tenta de novo."); }
}
async function joinRoom(code){
  code=(code||"").toUpperCase().trim();
  if(code.length!==4){ toast("O código tem 4 letras."); return; }
  try{
    const s = await db.doc("rooms/"+code).get();
    if(!s.exists){ toast("Não existe nenhuma sala com o código "+code+"."); return; }
    const d = s.data();
    if(d.v!==4){ toast("Esta sala é de uma versão antiga do jogo. Cria uma sala nova."); return; }
    if(d.status!=="lobby" && !(d.players && d.players[me.pid])){ toast("Este jogo já começou. Espera pelo próximo."); return; }
    if(d.status==="lobby") await db.doc(`rooms/${code}/players/${me.pid}`).set({name:me.name, icon:me.icon, kind:me.kind, t:Date.now()});
    S=null; subscribe(code); view=d.status==="lobby"?"lobby":"game"; render();
  }catch(e){ toast(e && e.code==="invalid_argument" ? "Este link não te deixa entrar. Pede acesso de Contribuidor." : "Não foi possível entrar. Tenta de novo."); }
}
function nextCpu(list){ const n=list.filter(p=>p.kind==="cpu").length; return {name:n?`CPU ${n+1}`:"CPU", icon:CPU_ICONS[n%CPU_ICONS.length], kind:"cpu"}; }

async function rmOnlineCpu(pid){ try{ await db.doc(`rooms/${roomCode}/players/${pid}`).delete(); }catch{ toast("Não foi possível remover o CPU."); } }
async function startOnline(){
  if(!lobbyPlayers.length) return;
  const players={}; lobbyPlayers.forEach(p=>players[p.pid]={name:p.name, icon:p.icon, kind:p.kind||"kid"});
  await loadStats(lobbyPlayers.filter(p=>p.kind!=="cpu").map(p=>p.name));

/* ---------- Cartão de pergunta (jogo e treino) ---------- */
let msel=[], mselKey=null;
function qCard(q, subj, st){
  const s=SUBJ[subj], rev=st.rev, can=st.can && !rev;
  const head = `<div class="qhead"><span class="dot" style="background:${s.c}"></span>${s.name}${st.limit&&!rev?`<span class="timer" id="timer">⏱ ${st.limit}s</span>`:""}<span style="margin-left:auto;display:flex;gap:6px">${q.x?`<span class="lvl xb">Extra</span>`:""}<span class="lvl" style="background:${DIFF_BG[st.diff||q.d]}">${DIFF_NAME[st.diff||q.d]}</span></span></div>
    <div class="qtopic">${esc(TOPICS[subj][q.ti])}</div>`;
  const qrow = `<div class="qrow"><div class="question">${esc(q.q)}</div>${canSpeak?`<button class="say" data-a="say" aria-label="Ouvir a pergunta">🔊</button>`:""}</div>`;
  let body="";
  if(q.type==="num"){
    const unit=unitOf(q.n), pre=/^x\s*=/.test(q.n)?`<span class="unit">x =</span>`:"";
    if(!rev) body = can ? `<div class="typed">${pre}<input id="typed" class="txt" inputmode="decimal" autocomplete="off" placeholder="A tua resposta" aria-label="A tua resposta">${unit?`<span class="unit">${unit}</span>`:""}</div>
        <button class="btn sun" data-a="typedOk">Responder</button>` : `<p class="note">À espera da resposta escrita…</p>`;
    else body = `<div class="opt ${st.res==="ok"?"right":"wrong"}"><span class="k">✎</span><span>Resposta: ${esc(st.pick==="⏱"?"sem resposta":(/^x\s*=/.test(q.n)&&!/x/.test(st.pick)?"x = ":"")+st.pick)}${st.pick!=="⏱"&&unit&&!String(st.pick).includes(unit)?" "+unit:""}</span></div>${st.res==="ok"?"":`<div class="opt right"><span class="k">✓</span><span>Certa: ${esc(q.n)}</span></div>`}`;
  } else if(q.type==="multi"){
    const k=q.a.length, chosen = rev ? (st.pick||[]) : msel;
    body = `<p class="pickn">${rev?"":`Escolhe ${k} respostas.`}</p><div class="opts">${st.opts.map((o,i)=>{
      const isSel=chosen.includes(i), good=o<k;
      let cls = rev ? (good ? (isSel?"right":"missed") : (isSel?"wrong":"")) : (isSel?"sel":"");
      return `<button class="opt ${cls}" data-a="msel" data-v="${i}" ${can?"":"disabled"} aria-pressed="${isSel}"><span class="k">${rev?(good?"✓":isSel?"✕":""):(isSel?"✓":"")}</span><span>${esc(optText(q,o))}${rev&&good&&!isSel?` <i class="mis">(faltou)</i>`:""}</span></button>`;
    }).join("")}</div>${can?`<button class="btn sun" id="msub" data-a="msub" ${msel.length===k?"":"disabled"}>Responder (${msel.length} de ${k})</button>`:""}`;
  } else {
    body = `<div class="opts">${st.opts.map((o,i)=>{
      let cls=""; if(rev){ if(o===0) cls="right"; else if(i===st.pick) cls="wrong"; }
      return `<button class="opt ${cls}" data-a="ans" data-v="${i}" ${can?"":"disabled"}><span class="k">${"ABCD"[i]}</span><span>${esc(optText(q,o))}</span></button>`;
    }).join("")}</div>`;
  }
  return `<div class="card stack">${head}${qrow}${body}</div>`;
}

function panel(){

  }
  const [subj]=t.q.split(":"), q=qOf(t.q), rev=t.phase==="result";
  const key=S.id+":"+S.turnIdx+":"+S.round+":"+t.qn; if(key!==mselKey){ mselKey=key; msel=[]; }
  const card = qCard(q, subj, {opts:t.opts, pick:t.pick, res:t.res, rev, can, diff:t.diff, limit:t.limit});
  if(!rev){
    const sk=S.skips[cur];
    return card + (can ? `<button class="btn alt" data-a="skip" ${sk>0?"":"disabled"}>${sk>0?`Pular esta pergunta (restam ${sk})`:"Já não tens pulos"}</button>` : wait);
  }
  const r=t.roll, fresh = r && r.id!==rollSeen && !reduced;
  const who = cpu ? esc(P.name) : "";
  const title = t.res==="ok" ? (cpu?`${who} acertou!`:"Certo!") : t.res==="part" ? (cpu?`${who} acertou em parte`:"Quase!") : (cpu?`${who} errou`:"Errado");
  const cls = t.res==="ok" ? "ok" : t.res==="part" ? "part" : "back";
  const result = `<div class="dicebox ${cls}" id="dicebox" data-id="${r?r.id:""}">
      ${r?`<div class="die ${fresh?"rolling":""}" id="die" aria-label="Dado bónus: mais ${r.v}">${fresh?"?":"+"+r.v}</div>`:`<div class="die">${t.res==="part"?"＝":"↩"}</div>`}
      <div><div class="big">${title}</div><div class="msg ${fresh?"wait":""}" id="rollmsg">${esc(t.fx)}</div></div></div>
    <div class="explain"><b>💡 Porquê?</b> ${esc(q.e)}</div>`;
  let next;
  if(cpu) next = humanHere() ? `<button class="btn sun" data-a="endTurn">Continuar: é a vez de ${esc(nextName())}</button>` : "";
  else next = can ? `<button class="btn" data-a="endTurn">Passar a vez</button>` : wait;
  return card + result + next;
}
function nextName(){
  let i=S.turnIdx;
  for(let k=0;k<S.order.length;k++){ i=(i+1)%S.order.length; if(S.pos[S.order[i]]<N) break; }
  return S.players[S.order[i]].name;
}
function syncDice(){
  const box=$("#dicebox"); if(!box || !box.dataset.id) return;
  const id=box.dataset.id; if(id===rollSeen) return;
  rollSeen=id; if(reduced) return;
  const r=S.turn.roll; let k=0;
  const iv=setInterval(()=>{
    const d=$("#die"); if(!d){ clearInterval(iv); return; }
    if(++k>=9){ clearInterval(iv); d.classList.remove("rolling"); d.textContent="+"+r.v; const m=$("#rollmsg"); if(m) m.classList.remove("wait"); return; }
    d.textContent="+"+pick(BONUS_DIE);
  },100);
}
let tmKey=null, tmEnd=0, tmInt=null;
function syncTimer(){
  const t=S.turn;
  if(S.status!=="playing" || t.phase!=="question" || !t.limit){ clearInterval(tmInt); tmKey=null; return; }
  const key=S.id+":"+S.turnIdx+":"+S.round+":"+t.qn;
  if(key!==tmKey){ tmKey=key; tmEnd=Date.now()+t.limit*1000; clearInterval(tmInt); tmInt=setInterval(tick,250); }
  tick();
}
function tick(){
  const left=Math.max(0, Math.ceil((tmEnd-Date.now())/1000)), el=$("#timer");
  if(el){ el.textContent=`⏱ ${left}s`; el.classList.toggle("low", left<=5); }
  if(left<=0){ clearInterval(tmInt); if(canAct() && S.turn.phase==="question") doTimeout(); }
}
function endPanel(){

    ${canRe?`<button class="btn sun" data-a="rematch">Jogar outra vez</button>`:`<p class="note">O anfitrião pode começar outro jogo.</p>`}
    <button class="btn alt" data-a="leave">Sair</button>`;
}

/* ---------- Ícones no tabuleiro ---------- */
function placeAll(){
  const board=$("#board"); if(!board) return;
  const layer=$("#tokens"), cellW=(board.clientWidth-6-18)/7, groups={};
  S.order.forEach(p=>{ const k=(disp[p]??0)%N; (groups[k]=groups[k]||[]).push(p); });
  S.order.forEach(p=>{
    let el=document.getElementById("tok-"+p);
    if(!el){ el=document.createElement("div"); el.id="tok-"+p; el.className="tok"; el.innerHTML=`<span></span>`; layer.appendChild(el); }
    el.querySelector("span").textContent=S.players[p].icon;
    el.classList.toggle("me", mode==="online" && p===me.pid);
    const i=(disp[p]??0)%N, cell=board.querySelector(`.cell[data-i="${i}"]`); if(!cell) return;
    const g=groups[i], k=g.indexOf(p), n=g.length;
    const cols = n===1 ? 1 : n<=4 ? 2 : 3, rows = Math.ceil(n/cols);
    const size = n===1 ? cellW*.8 : cellW/Math.max(cols,rows);
    const ox = n===1 ? cellW*.1 : (k%cols)*size + (cellW-cols*size)/2;
    const oy = n===1 ? cellW*.1 : Math.floor(k/cols)*size + (cellW-rows*size)/2;
    el.style.width=el.style.height=size+"px";
    el.querySelector("span").style.fontSize=(size*.78)+"px";
    el.style.transform=`translate(${cell.offsetLeft+ox}px,${cell.offsetTop+oy}px)`;
    el.style.zIndex = p===curPid()?3:2;
  });
}
function syncTokens(){
  const a=S.anim;
  if(a && a.id!==animSeen && S.order.includes(a.pid)){
    animSeen=a.id; animating.add(a.pid);
    const path=a.path.slice(1); let k=0;
    disp[a.pid]=a.path[0];
    const step=()=>{
      if(!S || !S.order.includes(a.pid)) return;
      if(k>=path.length){ animating.delete(a.pid); S.order.forEach(p=>{ if(!animating.has(p)) disp[p]=S.pos[p]; }); placeAll(); return; }
      disp[a.pid]=path[k++]; placeAll();
      const el=document.getElementById("tok-"+a.pid);
      if(el && !reduced){ el.classList.remove("hop"); void el.offsetWidth; el.classList.add("hop"); }
      setTimeout(step, reduced?60:320);
    };
    setTimeout(step, reduced?0:(S.turn.roll?1000:400));
  }
  S.order.forEach(p=>{ if(!animating.has(p)) disp[p]=S.pos[p]; });
  placeAll();
}
addEventListener("resize", ()=>{ if(view==="game") placeAll(); });

/* ---------- Festa da vitória ---------- */
function celebrate(){
  if(reduced) return;
  const c=document.createElement("canvas"); c.className="confetti"; document.body.appendChild(c);
  const ctx=c.getContext("2d"), dpr=window.devicePixelRatio||1, W=innerWidth, H=innerHeight;
  c.width=W*dpr; c.height=H*dpr; ctx.scale(dpr,dpr);
  const colors=["#FF6B6B","#FFC43D","#12A58C","#6C5CE7","#FF9142","#4FC3F7"], parts=[];
  const burst=(x,y,dir,n)=>{ for(let i=0;i<n;i++){ const a=(-Math.PI/2)+dir*.5+(Math.random()-.5)*1.1, v=9+Math.random()*9;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:6+Math.random()*6,h:8+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:colors[i%colors.length]}); } };
  burst(0,H,1,90); burst(W,H,-1,90); setTimeout(()=>burst(W/2,H*.6,0,120),700);
  const start=performance.now();
  (function frame(now){
    const el=now-start; ctx.clearRect(0,0,W,H);
    for(const p of parts){ p.vy+=.28; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.globalAlpha=Math.max(0,1-el/4200);
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2))+2); ctx.restore(); }
    if(el<4200) requestAnimationFrame(frame); else c.remove();
  })(start);
}

    case "ans": if(view==="review") rvAnswer(+v); else if(canAct()) doAnswer(+v); break;
    case "typedOk": { const val=$("#typed").value; if(view==="review") rvAnswer(val); else if(canAct()) doAnswer(val); break; }
    case "skip": if(canAct()) doSkip(); break;
    case "endTurn": if(canAct() || (isCpu(curPid()) && S.turn.phase==="result")) doEndTurn(false); break;
    case "forcePass": askConfirm("Passar a vez?", "O jogador perde esta jogada, sem responder.", "Passar a vez", ()=>doEndTurn(true)); break;
    case "rematch": doRematch(); break;
  }
});
/* ============ VERSÃO INDEPENDENTE: jogo em vários telemóveis sem contas ============
   O telemóvel que cria a sala guarda o jogo e reenvia cada jogada aos outros.
   A ligação é directa entre telemóveis (WebRTC); o serviço público do PeerJS só faz a apresentação inicial.
   Estas funções substituem as da versão Claude com o mesmo nome. */
const PEER_PREFIX = "escada-saber-mz-";
const URLP = new URLSearchParams(location.search);
function peerOpts(){
  const h = URLP.get("peerhost");                     // só para testes: ?peerhost=localhost:9000
  if(!h) return {debug:0};
  const [host,port]=h.split(":");
  return {host, port:+port||9000, path:"/", secure:false, debug:0};
}
let peer=null, conns=[], hostConn=null, amHost=false, wakeLock=null, joinTimer=null;
const shareUrl = code => location.origin + location.pathname + "?sala=" + code;

function hostSave(){ if(amHost) save("esc_host", {code:roomCode, S, lobbyPlayers}); }
function bcast(msg, except){ conns.forEach(c=>{ if(c!==except && c.open){ try{ c.send(msg); }catch{} } }); }
function lobbyMsg(){ return {t:"lobby", players:lobbyPlayers, room:S}; }
async function keepAwake(){ try{ if("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); }catch{} }
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && amHost) keepAwake(); });

function commit(n){
  n.seq = (S?.seq||0) + 1;
  S = n;
  if(mode==="local") save("esc_local", S);
  else if(mode==="online"){
    if(amHost){ hostSave(); bcast({t:"state", S}); }
    else if(hostConn && hostConn.open) hostConn.send({t:"state", S});
    else toast("Sem ligação ao telemóvel que criou a sala.");
  }
  render();
}

/* ---------- Anfitrião ---------- */
function hostRecv(c, d){
  if(!d || typeof d!=="object") return;
  if(d.t==="hello"){
    const p=d.player; c._pid=p.pid;
    if(S.status==="lobby"){
      const i=lobbyPlayers.findIndex(x=>x.pid===p.pid);
      if(i>=0) lobbyPlayers[i]={...lobbyPlayers[i], name:p.name, icon:p.icon, kind:p.kind};
      else if(lobbyPlayers.length>=6){ c.send({t:"full"}); return; }
      else lobbyPlayers.push({pid:p.pid, name:p.name, icon:p.icon, kind:p.kind, t:Date.now()});
      hostSave(); bcast(lobbyMsg()); render();
    } else if(S.players && S.players[p.pid]) c.send({t:"state", S});
    else c.send({t:"started"});
  } else if(d.t==="state" && d.S){
    // Só o jogador da vez (ou o anfitrião) altera o jogo; aceita-se a versão mais recente.
    if(d.S.id!==S.id || (d.S.seq||0) <= (S.seq||0)) { c.send({t:"state", S}); return; }
    S=d.S; hostSave(); bcast({t:"state", S}, c); render();
  }
}
function startHost(code, restore){
  if(peer) try{ peer.destroy(); }catch{}
  amHost=true; conns=[];
  let tries=0;
  const open = ()=>{
    peer = new Peer(PEER_PREFIX+code.toLowerCase(), peerOpts());
    peer.on("open", ()=>{
      roomCode=code; mode="online"; save("esc_room", code);
      if(restore){ S=restore.S; lobbyPlayers=restore.lobbyPlayers||[]; }
      else { S={v:4, id:rid(), code, host:me.pid, status:"lobby", extra:true, seq:1}; lobbyPlayers=[{pid:me.pid, name:me.name, icon:me.icon, kind:me.kind, t:Date.now()}]; }
      hostSave(); keepAwake();
      view = S.status==="lobby" ? "lobby" : "game"; boardBuilt=false; render();
    });
    peer.on("connection", c=>{
      c.on("open", ()=>{ conns.push(c); c.send(S.status==="lobby" ? lobbyMsg() : {t:"state", S}); });
      c.on("data", d=>hostRecv(c,d));
      c.on("close", ()=>{ conns=conns.filter(x=>x!==c); });
    });
    peer.on("disconnected", ()=>{ try{ peer.reconnect(); }catch{} });
    peer.on("error", e=>{
      if(e.type==="unavailable-id"){
        if(restore && tries<5){ tries++; toast("A recuperar a sala…"); setTimeout(open, 3000); }
        else if(!restore){ code=genCode(); open(); }
        else toast("Não foi possível recuperar a sala. Cria uma sala nova.");
      } else if(e.type==="network" || e.type==="server-error" || e.type==="socket-error"){
        toast("Sem ligação à internet. Para criar a sala é preciso internet.");
      }
    });
  };
  open();
}
async function createRoom(){
  if(typeof Peer==="undefined"){ toast("O modo online não carregou. Joguem num só telemóvel."); return; }
  startHost(genCode(), null);
}

/* ---------- Convidado ---------- */
function guestRecv(d){
  if(!d || typeof d!=="object") return;
  clearTimeout(joinTimer);
  if(d.t==="lobby"){ lobbyPlayers=d.players||[]; S=d.room; view="lobby"; render(); }
  else if(d.t==="state" && d.S){
    if(!S || d.S.id!==S.id || (d.S.seq||0) >= (S.seq||0) || d.S.status!==S.status) S=d.S;
    if(S.status==="lobby") view="lobby";
    else { if(view!=="game") boardBuilt=false; view="game"; loadStats(Object.values(S.players).filter(p=>p.kind!=="cpu").map(p=>p.name)); }
    render();
  }
  else if(d.t==="full"){ toast("A sala já tem 6 jogadores."); exitToHome(); }
  else if(d.t==="started"){ toast("Este jogo já começou. Espera pelo próximo."); exitToHome(); }
}
let retryT=null, retries=0;
function guestConnect(code){
  hostConn = peer.connect(PEER_PREFIX+code.toLowerCase(), {reliable:true});
  hostConn.on("open", ()=>{
    retries=0; roomCode=code; mode="online"; save("esc_room", code);
    hostConn.send({t:"hello", player:{pid:me.pid, name:me.name, icon:me.icon, kind:me.kind}});
  });
  hostConn.on("data", guestRecv);
  hostConn.on("close", ()=>{ if(mode==="online" && roomCode===code && !amHost){ toast("Perdeu-se a ligação. A tentar de novo…"); scheduleRetry(code); } });
}
function scheduleRetry(code){
  clearTimeout(retryT);
  if(retries>=15){ toast("Não foi possível voltar a ligar. O telemóvel que criou a sala ainda tem o jogo aberto?"); return; }
  retries++;
  retryT=setTimeout(()=>{ if(peer && !peer.destroyed && roomCode===code && !amHost) guestConnect(code); }, 4000);
}
async function joinRoom(code){
  code=(code||"").toUpperCase().trim();
  if(code.length!==4){ toast("O código tem 4 letras."); return; }
  if(typeof Peer==="undefined"){ toast("O modo online não carregou. Confirma a internet."); return; }
  if(peer) try{ peer.destroy(); }catch{}
  amHost=false; S=null; retries=0; roomCode=code; toast("A procurar a sala "+code+"…");
  peer = new Peer(undefined, peerOpts());
  peer.on("open", ()=>{
    guestConnect(code);
    clearTimeout(joinTimer);
    joinTimer=setTimeout(()=>{ if(!S) toast("Não consegui ligar à sala. Confirma o código e se estão no mesmo Wi-Fi."); }, 15000);
  });
  peer.on("disconnected", ()=>{ try{ peer.reconnect(); }catch{} });
  peer.on("error", e=>{
    if(e.type==="peer-unavailable"){
      if(mode==="online" && S) scheduleRetry(code);      // já estava a jogar: o anfitrião pode estar a recarregar
      else { toast("Não encontrei a sala "+code+". O telemóvel que a criou ainda está com o jogo aberto?"); roomCode=null; }
    }
    else if(e.type==="network" || e.type==="server-error" || e.type==="socket-error") toast("Sem ligação à internet.");
  });
}

/* ---------- Sala: CPU, início, saída ---------- */
async function addOnlineCpu(){ if(!amHost) return; lobbyPlayers.push({...nextCpu(lobbyPlayers), pid:"cpu-"+rid(), t:Date.now()}); hostSave(); bcast(lobbyMsg()); render(); }
async function rmOnlineCpu(pid){ if(!amHost) return; lobbyPlayers=lobbyPlayers.filter(p=>p.pid!==pid); hostSave(); bcast(lobbyMsg()); render(); }
function unsub(){}
function exitToHome(){
  clearTimeout(retryT); clearTimeout(joinTimer);
  if(peer) try{ peer.destroy(); }catch{}
  peer=null; conns=[]; hostConn=null; amHost=false; try{ wakeLock && wakeLock.release(); }catch{}
  S=null; mode=null; roomCode=null; lobbyPlayers=[]; view="home"; render();
}
function leave(){ del("esc_room"); del("esc_host"); if(mode==="local") del("esc_local"); exitToHome(); }
function resumeRoom(){
  const h=load("esc_host"), code=load("esc_room");
  if(h && h.code===code && h.S && h.S.host===me.pid) startHost(code, h);
  else joinRoom(code);
}

/* ---------- Ecrãs ---------- */
function lobbyView(){
  const isHost = amHost;
  const url = shareUrl(roomCode), canShare = !!navigator.share;
  let qr="";
  try{ const q=qrcode(0,"M"); q.addData(url); q.make(); qr=q.createSvgTag({cellSize:6, margin:2, scalable:true}); }catch{}
  const fileMode = location.protocol==="file:";
  return `<div class="home">
    <button class="back" data-a="leave">← Sair da sala</button>
    <div class="card" style="text-align:center">
      <p class="muted" style="margin:0 0 6px">Código da sala</p>
      <div class="bigcode">${esc(roomCode)}</div>
      ${isHost ? (fileMode ? `<p class="note" style="margin-top:10px">Este ficheiro foi aberto directamente do telemóvel, por isso o QR code não funciona. Aloja-o num endereço da internet (ver instruções) ou os outros escrevem o código acima.</p>`
        : `<div class="qr" aria-label="QR code para entrar na sala">${qr}</div>
        <p class="muted" style="margin:6px 0 0">Os outros apontam a câmara para o QR code. Não precisam de conta.</p>
        <div class="row" style="margin-top:10px">${canShare?`<button class="btn alt sm" data-a="shareRoom">📤 Partilhar link</button>`:""}<button class="btn alt sm" data-a="copyRoom">📋 Copiar link</button></div>`)
      : `<p class="muted" style="margin:10px 0 0">Ligado à sala. Espera que quem a criou comece o jogo.</p>`}
    </div>
    <ul class="plist">${lobbyPlayers.map(p=>`<li><span class="ic">${esc(p.icon)}</span><span>${esc(p.name)}<br><span class="r">${kindTag(p.kind||"kid")}</span></span>${p.kind==="cpu"&&isHost?`<button class="tag" data-a="rmCpu" data-v="${esc(p.pid)}">Remover ✕</button>`:p.pid===S?.host?`<span class="tag">anfitrião</span>`:p.pid===me.pid?`<span class="tag">tu</span>`:""}</li>`).join("") || `<li class="muted">À espera de jogadores…</li>`}</ul>
    ${isHost && lobbyPlayers.length<6?`<button class="btn alt" data-a="addCpu">🤖 Adicionar CPU</button>`:""}
    ${isHost?`<div><span class="lbl">Perguntas extra (temas de exames anteriores)</span><div class="seg"><button data-a="xtra" data-v="1" aria-pressed="${S.extra!==false}">Incluir</button><button data-a="xtra" data-v="0" aria-pressed="${S.extra===false}">Só matriz 2026</button></div></div>
      <button class="btn sun" data-a="startOnline" ${lobbyPlayers.length?"":"disabled"}>Começar jogo com ${lobbyPlayers.length} ${lobbyPlayers.length===1?"jogador":"jogadores"}</button>
      <p class="note">Mantém este telemóvel com o jogo aberto até ao fim: é ele que liga todos os outros.</p>`
      :`<p class="note">À espera que o anfitrião comece o jogo.</p>`}
  </div>`;
}
function homeView(){
  const savedRoom = load("esc_room"), savedLocal = load("esc_local"), online = typeof Peer!=="undefined";
  return `<div class="home">
    <div class="stair" aria-hidden="true">
      <span style="height:25%;background:var(--coral)"></span><span style="height:45%;background:var(--sun)"></span>
      <span style="height:65%;background:var(--teal)"></span><span style="height:85%;background:var(--violet)"></span>
      <span style="height:100%;background:var(--orange)"></span>
    </div>
    <div>
      <h1 class="title">Escada do Saber</h1>
      <p class="subtitle">Treino em família para os exames da 6ª classe de 2026. Quem sabe mais, chega primeiro à meta.</p>
    </div>
    <div class="stack">
      ${savedLocal && savedLocal.v===4 && savedLocal.status==="playing" ? `<button class="btn teal" data-a="resumeLocal">Continuar jogo neste telemóvel</button>` : ""}
      ${online && savedRoom ? `<button class="btn teal" data-a="resume">Voltar à sala ${esc(savedRoom)}</button>` : ""}
      <button class="btn sun" data-a="goCreate" ${online?"":"disabled"}>Criar sala com QR code</button>
      <div class="row"><button class="btn alt" data-a="goJoin" ${online?"":"disabled"}>Entrar com código</button><button class="btn alt" data-a="goLocal">Num só telemóvel</button></div>
      <p class="note">${online ? "Cada um joga no seu telemóvel, sem contas. Funciona melhor com todos no mesmo Wi-Fi." : "O modo de vários telemóveis precisa de internet. Podem jogar num só telemóvel."}</p>
      <div class="grid2"><button class="btn alt sm" data-a="essay">✍️ Redacção</button><button class="btn alt sm" data-a="report">📊 Progresso</button><button class="btn alt sm" data-a="board">🏆 Recordes</button><button class="btn alt sm" data-a="rules">📖 Regras</button></div>
    </div>
  </div>`;
}

/* Botões próprios desta versão (tratados antes do resto) */
document.addEventListener("click", e=>{
  const b=e.target.closest("[data-a]"); if(!b) return;
  const a=b.dataset.a;
  if(a==="copyRoom"){ e.stopImmediatePropagation(); const u=shareUrl(roomCode);
    (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(()=>toast("Link copiado.")).catch(()=>toast(u)); }
  if(a==="shareRoom"){ e.stopImmediatePropagation(); navigator.share({title:"Escada do Saber", text:`Entra na minha sala (código ${roomCode})`, url:shareUrl(roomCode)}).catch(()=>{}); }
  if(a==="resume"){ e.stopImmediatePropagation(); if(!me.name||!me.icon){ intent="join"; view="profile"; render(); return; } resumeRoom(); }
}, true);

/* Entrar directamente pelo link do QR code (?sala=CODE) */
const SALA = (URLP.get("sala")||"").toUpperCase().replace(/[^A-Z]/g,"").slice(0,4);
if(SALA.length===4 && me.name && me.icon){ setTimeout(()=>joinRoom(SALA), 0); }
else if(SALA.length===4){
  intent="joinCode"; view="profile";
  document.addEventListener("click", e=>{
    const b=e.target.closest('[data-a="profileOk"]');
    if(b && intent==="joinCode"){
      e.stopImmediatePropagation();
      me.name=($("#nm").value||"").trim();
      if(!me.name){ toast("Escreve o teu nome."); return; }
      if(!me.icon){ toast("Escolhe um ícone."); return; }
      save("esc_me", me); intent="join"; joinRoom(SALA);
    }
  }, true);
}

render();
</script>
